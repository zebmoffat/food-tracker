<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macro & Micro Tracker</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        padding: 20px;
        background: #f9f9f9;
        text-align: center;
      }
      .dashboard {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .circle-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: conic-gradient(
          var(--color) calc(var(--percent) * 1%),
          #e0e0e0 0
        );
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        transition: background 0.3s;
      }
      .circle.over {
        background: conic-gradient(
          #ff4d4d calc(var(--percent) * 1%),
          #e0e0e0 0
        );
      }
      .circle-inner {
        width: 80px;
        height: 80px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .circle-inner span {
        font-size: 12px;
        color: #555;
      }
      .circle-inner strong {
        font-size: 16px;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 350px;
        margin: 0 auto;
      }
      .input-group {
        display: flex;
        gap: 10px;
      }
      select {
        flex-grow: 1;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      button {
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-add {
        background: #28a745;
        color: white;
      }
      .btn-submit {
        background: #007bff;
        color: white;
        width: 100%;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      #queue-list {
        list-style: none;
        padding: 0;
        margin: 0;
        text-align: left;
      }
      #queue-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ddd;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .btn-remove {
        background: #ff4d4d;
        color: white;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
      }

      #status {
        margin-top: 10px;
        font-size: 14px;
        color: #666;
        min-height: 20px;
      }

      /* Styles for the daily log display */
      .log-container {
        margin-top: 30px;
        max-width: 350px;
        margin-left: auto;
        margin-right: auto;
        text-align: left;
      }
      .log-container h3 {
        font-size: 18px;
        color: #333;
        border-bottom: 2px solid #ddd;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      #daily-log-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 14px;
        color: #444;
      }
      #daily-log-list li {
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard" id="dashboard">
      <!-- Circles injected via JS -->
    </div>

    <div class="controls">
      <div class="input-group">
        <select id="food-select">
          <option value="">Select a food...</option>
        </select>
        <button class="btn-add" onclick="addToQueue()">Add</button>
      </div>

      <ul id="queue-list"></ul>

      <button
        class="btn-submit"
        id="submit-btn"
        onclick="submitFood()"
        disabled
      >
        Log Food
      </button>
      <div id="status"></div>
    </div>

    <div class="log-container">
      <h3>Today's Log</h3>
      <ul id="daily-log-list">
        <!-- Logged items injected via JS -->
      </ul>
    </div>

    <script>
      // --- CONFIGURATION ---
      const GITHUB_USER = "zebmoffat"; // Update this
      const GITHUB_REPO = "food-tracker"; // Update this

      const TRACKING_ORDER = [
        "Calories",
        "Fat",
        "Carbs",
        "Protein",
        "Fiber",
        "Sodium",
        "Potassium",
      ];
      const DAILY_GOALS = {
        Calories: 2300,
        Fat: 100,
        Carbs: 200,
        Protein: 150,
        Fiber: 40,
        Sodium: 3000,
        Potassium: 3800,
      };
      const COLORS = {
        Calories: "#34495e",
        Fat: "#f5a623",
        Carbs: "#4a90e2",
        Protein: "#d0021b",
        Fiber: "#e67e22",
        Sodium: "#bd10e0",
        Potassium: "#7ed321",
      };

      let foodDatabase = {};
      let currentTotals = {
        Calories: 0,
        Fat: 0,
        Carbs: 0,
        Protein: 0,
        Fiber: 0,
        Sodium: 0,
        Potassium: 0,
      };
      let foodQueue = [];

      // --- INITIALIZATION ---
      async function init() {
        await loadCSV();

        if (!localStorage.getItem("gh_pat")) {
          const token = prompt(
            "Enter your GitHub Personal Access Token (PAT) with repo scope:",
          );
          if (token) localStorage.setItem("gh_pat", token);
        }

        renderCircles();

        document.getElementById("status").innerText = "Loading today's log...";
        await fetchTodaysLog();
      }

      async function loadCSV() {
        try {
          const response = await fetch(`foods.csv?t=${new Date().getTime()}`);
          const text = await response.text();
          const lines = text.split("\n").filter((line) => line.trim() !== "");

          const select = document.getElementById("food-select");
          let foodNames = [];

          for (let i = 1; i < lines.length; i++) {
            const data = lines[i].split(",");
            if (data.length < 8) continue;

            const foodName = data[0].trim();
            foodNames.push(foodName);

            foodDatabase[foodName] = {
              Calories: parseFloat(data[1]),
              Fat: parseFloat(data[2]),
              Carbs: parseFloat(data[3]),
              Protein: parseFloat(data[4]),
              Fiber: parseFloat(data[5]),
              Sodium: parseFloat(data[6]),
              Potassium: parseFloat(data[7]),
            };
          }

          foodNames.sort((a, b) => a.localeCompare(b));

          foodNames.forEach((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            select.appendChild(option);
          });
        } catch (err) {
          document.getElementById("status").innerText =
            "Failed to load foods.csv";
        }
      }

      function renderCircles() {
        const dash = document.getElementById("dashboard");
        dash.innerHTML = "";

        TRACKING_ORDER.forEach((macro) => {
          const val = currentTotals[macro];
          const goal = DAILY_GOALS[macro];
          const percent = Math.min((val / goal) * 100, 100);
          const isOver = val > goal;

          dash.innerHTML += `
                <div class="circle-wrap">
                    <div class="circle ${isOver ? "over" : ""}" style="--percent: ${percent}; --color: ${COLORS[macro]}">
                        <div class="circle-inner">
                            <strong>${val.toFixed(1)}</strong>
                            <span>/ ${goal}</span>
                        </div>
                    </div>
                    <span>${macro}</span>
                </div>
            `;
        });
      }

      // --- QUEUE LOGIC ---
      function addToQueue() {
        const select = document.getElementById("food-select");
        const foodName = select.value;
        if (!foodName) return;

        foodQueue.push(foodName);
        renderQueue();
        select.value = "";
      }

      function removeFromQueue(index) {
        foodQueue.splice(index, 1);
        renderQueue();
      }

      function renderQueue() {
        const list = document.getElementById("queue-list");
        list.innerHTML = "";
        foodQueue.forEach((food, index) => {
          list.innerHTML += `<li>${food} <button class="btn-remove" onclick="removeFromQueue(${index})">×</button></li>`;
        });
        document.getElementById("submit-btn").disabled = foodQueue.length === 0;
      }

      // --- FETCH EXISTING DATA ---
      async function fetchTodaysLog() {
        const token = localStorage.getItem("gh_pat");
        if (!token) return;

        const date = new Date();
        const path = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}.txt`;
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?t=${new Date().getTime()}`;

        Object.keys(currentTotals).forEach((k) => (currentTotals[k] = 0));

        const displayList = document.getElementById("daily-log-list");
        displayList.innerHTML = "";

        try {
          const getRes = await fetch(apiUrl, {
            headers: {
              Authorization: `token ${token}`,
              Accept: "application/vnd.github.v3+json",
            },
            cache: "no-store",
          });

          if (getRes.ok) {
            const fileData = await getRes.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            const lines = content.split("\n");
            const regex =
              /Cal:\s*([\d.]+),\s*Fat:\s*([\d.]+)g,\s*Carbs:\s*([\d.]+)g,\s*Pro:\s*([\d.]+)g,\s*Fiber:\s*([\d.]+)g,\s*Na:\s*([\d.]+)mg,\s*K:\s*([\d.]+)mg/i;

            let entriesFound = 0;
            let timeColors = {}; // Store time-to-color mapping

            lines.forEach((line) => {
              const match = line.match(regex);
              if (match) {
                currentTotals.Calories += parseFloat(match[1]);
                currentTotals.Fat += parseFloat(match[2]);
                currentTotals.Carbs += parseFloat(match[3]);
                currentTotals.Protein += parseFloat(match[4]);
                currentTotals.Fiber += parseFloat(match[5]);
                currentTotals.Sodium += parseFloat(match[6]);
                currentTotals.Potassium += parseFloat(match[7]);

                const displayText = line.split("- Cal:")[0].trim();

                // Extract the time from the [time] bracket
                let bgColorStyle = "";
                const timeMatch = displayText.match(/^\[(.*?)\]/);
                if (timeMatch) {
                  const timeStr = timeMatch[1];
                  if (!timeColors[timeStr]) {
                    // Generate a random pastel color for readability
                    const hue = Math.floor(Math.random() * 360);
                    timeColors[timeStr] = `hsl(${hue}, 70%, 85%)`;
                  }
                  bgColorStyle = `style="background-color: ${timeColors[timeStr]};"`;
                }

                displayList.innerHTML += `<li ${bgColorStyle}>${displayText}</li>`;

                entriesFound++;
              }
            });

            if (entriesFound === 0) {
              displayList.innerHTML = "<li>No foods logged yet.</li>";
            }

            renderCircles();
            setStatus(`Loaded ${entriesFound} entries for today.`);
          } else if (getRes.status === 404) {
            displayList.innerHTML = "<li>No foods logged yet.</li>";
            renderCircles();
            setStatus("No log for today yet. Starting fresh!");
          }
        } catch (error) {
          displayList.innerHTML = "<li>Error loading log.</li>";
          setStatus("Could not load existing log.");
        }
      }

      // --- GITHUB API INTEGRATION ---
      async function submitFood() {
        if (foodQueue.length === 0) return;

        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        setStatus("Syncing with GitHub...");

        const date = new Date();
        const time = date.toLocaleTimeString();
        const path = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}.txt`;

        let logEntries = "";
        foodQueue.forEach((foodName) => {
          const m = foodDatabase[foodName];
          logEntries += `[${time}] ${foodName} - Cal:${m.Calories}, Fat:${m.Fat}g, Carbs:${m.Carbs}g, Pro:${m.Protein}g, Fiber:${m.Fiber}g, Na:${m.Sodium}mg, K:${m.Potassium}mg\n`;
        });

        const token = localStorage.getItem("gh_pat");
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;

        try {
          let fileSha = null;
          let existingContent = "";
          const getRes = await fetch(apiUrl, {
            headers: { Authorization: `token ${token}` },
            cache: "no-store",
          });

          if (getRes.ok) {
            const fileData = await getRes.json();
            fileSha = fileData.sha;
            existingContent = decodeURIComponent(
              escape(atob(fileData.content)),
            );
          }

          const newContent = existingContent + logEntries;
          const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

          const body = {
            message: `Logged ${foodQueue.length} items`,
            content: encodedContent,
          };
          if (fileSha) body.sha = fileSha;

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              Authorization: `token ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          });

          if (putRes.ok) {
            setStatus("Successfully logged!");
            foodQueue = [];
            renderQueue();
            await fetchTodaysLog();
          } else {
            throw new Error("Failed to commit");
          }
        } catch (error) {
          setStatus("Error syncing to GitHub.");
        } finally {
          btn.disabled = false;
        }
      }

      function setStatus(msg) {
        const el = document.getElementById("status");
        el.innerText = msg;
        setTimeout(() => {
          if (el.innerText === msg) el.innerText = "";
        }, 3000);
      }

      init();
    </script>
  </body>
</html>
